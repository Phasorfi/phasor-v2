[profile.default]
src = "packages/"
out = "out"
libs = ["node_modules", "lib", "packages/core/node_modules", "packages/periphery/node_modules"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v2-core/=packages/periphery/node_modules/@uniswap/v2-core/",
    "@uniswap/lib/=packages/periphery/node_modules/@uniswap/lib/",
    # Velodrome fork remappings - map internal contracts/ paths
    "contracts/=packages/velodrome-fork/contracts/",
    # OpenGSN forwarder (used by Velodrome for meta-transactions)
    "@opengsn/contracts/=lib/gsn/packages/contracts/",
    # Hardhat console stub
    "hardhat/=lib/hardhat/"
]

# Force @uniswap/lib to compile with Solidity 0.6.6 to match periphery contracts
# Force MISO contracts to compile with Solidity 0.6.12
compilation_restrictions = [
    { paths = "packages/periphery/node_modules/@uniswap/lib/**", version = "0.6.6" },
    { paths = "packages/miso-fork/contracts/**", version = "0.6.12" }
]

# The optimizer is the key here
# VotingEscrow and other Velodrome contracts require low optimizer runs to stay under 24KB limit
optimizer = true
optimizer_runs = 200
