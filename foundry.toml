[profile.default]
src = "packages/velodrome-fork/contracts"
out = "out"
libs = ["packages/velodrome-fork/lib"]
remappings = [
    "@openzeppelin/contracts/=packages/velodrome-fork/lib/openzeppelin-contracts/contracts/",
    "contracts/=packages/velodrome-fork/contracts/",
    "@opengsn/contracts/=packages/velodrome-fork/lib/gsn/packages/contracts/",
    "forge-std/=packages/velodrome-fork/lib/forge-std/src/",
    "ds-test/=packages/velodrome-fork/lib/ds-test/src/",
    "hardhat/=packages/velodrome-fork/lib/hardhat/"
]

# Exclude node_modules from compilation
exclude = ["packages/envio-indexer/node_modules/**", "packages/phasor-dex/node_modules/**", "node_modules/**"]

# VotingEscrow and other Velodrome contracts require low optimizer runs to stay under 24KB limit
optimizer = true
optimizer_runs = 200
solc_version = "0.8.29"
